[workspace]
resolver = "2"
members = ["crates/acme-server", "crates/acme-client", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Pinned major lines for the whole product (see specs/000-Initial-Spec.md §3).
# A crate opts in with `dep = { workspace = true }`; unused entries here cost
# nothing to build — they only matter once a crate references them. Centralizing
# them lets every future crate (acme-client, acme-cli, xtask) share one resolved
# version set and one Cargo.lock, so a shared dependency compiles once.
[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-br", "fs", "limit", "timeout"] }
maud = { version = "0.27", features = ["axum"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "chrono", "macros"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "preserve_order"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_qs = "0.13"
fake = { version = "4", features = ["derive", "chrono"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
figment = { version = "0.10", features = ["env", "toml"] }
insta = "1"
axum-test = "17"
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
regex = "1"
bytes = "1"
progenitor = "0.15"
progenitor-client = "0.15"
