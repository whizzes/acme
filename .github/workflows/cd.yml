name: Continuous Delivery

on:
  push:
    branches:
      - main
    tags:
      - '*'

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  IMAGE_NAME: acme
  GHCR_REGISTRY: ghcr.io/whizzes

jobs:
  package:
    name: Package Application
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: 1
    strategy:
      matrix:
        os:
          - ubuntu-latest
        rust_target:
          - x86_64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version Write-Out (Tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Version Write-Out (Commit)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "VERSION=$(echo ${GITHUB_SHA:0:7})" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cargo Binstall
        uses: cargo-bins/cargo-binstall@main

      # Stick to version v0.12.0 for now, due to: https://github.com/ziglang/zig/issues/23273
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.12.0

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates tzdata build-essential musl-tools openssl libssl-dev pkg-config

      - name: Install Rust Binaries
        run: |
          cargo binstall -y --force cargo-zigbuild
          cargo binstall -y --force just
          cargo binstall -y --force trunk

      - name: Build for Release
        run: just build-release "$VERSION" ${{ matrix.rust_target }}

      - name: Build Docker Image
        run: |
          just build-docker-image "$VERSION" ${{ matrix.rust_target }}

      - name: Push Pre-Release Image to GHCR
        run: |
          just push-docker-image "$VERSION" ${{ env.GHCR_REGISTRY }} ${{ matrix.rust_target }}


      - name: Create Stable Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --draft=false \
            --generate-notes \
            --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Nightly Release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --draft=false \
            --generate-notes \
            --prerelease=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive Release Assets
        shell: bash
        run: |
          chmod +x ./target/${{ matrix.rust_target }}/release/acme
          cp ./target/${{ matrix.rust_target }}/release/acme ./acme-${{ matrix.rust_target }}

      - name: Attach Binaries to Release
        uses: svenstaro/upload-release-action@2.9.0
        with:
          asset_name: acme-${{ matrix.rust_target }}
          file: acme-${{ matrix.rust_target }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: "${{ env.VERSION }}"
